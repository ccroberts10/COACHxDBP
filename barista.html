<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBP Staff · Redeem</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0a0a0a;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
  .container{max-width:480px;margin:0 auto;padding:30px 20px}
  .brand{font-weight:700;font-size:1.1rem;letter-spacing:-0.02em;margin-bottom:8px;text-align:center}
  .brand span{color:#4ade80}
  .label{color:#888;font-size:0.85rem;text-align:center;margin-bottom:24px}
  label{display:block;font-size:0.85rem;color:#aaa;margin:14px 0 6px;font-weight:500}
  input{width:100%;padding:14px;font-size:1.2rem;background:#111;border:1px solid #1f1f1f;border-radius:10px;color:#fff;font-family:monospace;letter-spacing:0.05em;text-transform:uppercase}
  input:focus{outline:none;border-color:#4ade80}
  .btn{width:100%;padding:16px;font-size:1.05rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-family:inherit;margin-top:14px}
  .btn-primary{background:#4ade80;color:#000}
  .btn-secondary{background:#1a1a1a;color:#fff;border:1px solid #2a2a2a}
  .btn:active{transform:scale(0.98)}
  .btn:disabled{opacity:0.5;cursor:wait}
  .result{margin-top:18px;padding:18px;border-radius:12px;display:none}
  .result.show{display:block}
  .result.valid{background:#0d2818;border:1px solid #1f5a35}
  .result.invalid{background:#3a1212;border:1px solid #5a2828}
  .result h2{margin:0 0 6px;font-size:1.2rem}
  .result.valid h2{color:#4ade80}
  .result.invalid h2{color:#f87171}
  .result p{margin:4px 0;color:#ddd;font-size:0.92rem}
  .result .name{font-size:1rem;color:#fff;font-weight:600}
  .result .desc{color:#aaa;font-size:0.88rem;margin:8px 0}
  .pin-display{background:#1a1a1a;border-radius:8px;padding:8px 12px;font-family:monospace;font-size:0.85rem;color:#888;margin-top:6px}
  .pin-display.hide{filter:blur(4px);user-select:none}
</style>
</head>
<body>
<div class="container">
  <div class="brand">🚴 DBP <span>Staff</span></div>
  <div class="label">Redeem member perk</div>

  <label>Staff PIN</label>
  <input type="password" id="pin" placeholder="••••••" inputmode="numeric" maxlength="6">

  <label>Member code</label>
  <input type="text" id="code" placeholder="DBP-XXXX" maxlength="10" oninput="this.value = this.value.toUpperCase()">

  <button class="btn btn-secondary" onclick="lookup()">Look up</button>
  <button class="btn btn-primary" id="redeemBtn" onclick="redeem()" style="display:none">Mark redeemed</button>

  <div class="result" id="result"></div>
</div>

<script>
let pendingPerk = null;

async function lookup(){
  const pin = document.getElementById('pin').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  const result = document.getElementById('result');
  if (!pin || !code) {
    showResult(false, 'Both PIN and code required', '');
    return;
  }
  try {
    const r = await fetch('/api/perks/lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin, code }),
    });
    const data = await r.json();
    if (data.error) {
      showResult(false, data.error, '');
      pendingPerk = null;
      document.getElementById('redeemBtn').style.display = 'none';
      return;
    }
    if (data.redeemed) {
      showResult(false, '✗ Already redeemed', `${data.user_name} · ${data.description}`);
      pendingPerk = null;
      document.getElementById('redeemBtn').style.display = 'none';
      return;
    }
    if (data.expired) {
      showResult(false, '✗ Code expired', `${data.user_name} · ${data.description}`);
      pendingPerk = null;
      document.getElementById('redeemBtn').style.display = 'none';
      return;
    }
    pendingPerk = data;
    showResult(true, `✓ Valid · ${data.user_name}`, data.description);
    document.getElementById('redeemBtn').style.display = 'block';
  } catch(e) {
    showResult(false, e.message, '');
  }
}

async function redeem(){
  if (!pendingPerk) return;
  const pin = document.getElementById('pin').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  const btn = document.getElementById('redeemBtn');
  btn.disabled = true;
  btn.textContent = 'Redeeming…';
  try {
    const r = await fetch('/api/perks/redeem', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin, code }),
    });
    const data = await r.json();
    if (data.success) {
      showResult(true, '✓ Redeemed!', `${pendingPerk.user_name} · ${pendingPerk.description}`);
      btn.style.display = 'none';
      document.getElementById('code').value = '';
      pendingPerk = null;
    } else {
      showResult(false, data.error, '');
    }
  } catch(e) {
    showResult(false, e.message, '');
  }
  btn.disabled = false;
  btn.textContent = 'Mark redeemed';
}

function showResult(valid, title, body){
  const el = document.getElementById('result');
  el.className = 'result show ' + (valid ? 'valid' : 'invalid');
  el.innerHTML = `<h2>${title}</h2>${body ? '<p class="desc">' + body + '</p>' : ''}`;
}

document.getElementById('code').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') lookup();
});
</script>
</body>
</html>
