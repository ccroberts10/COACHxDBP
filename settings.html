<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · DBP Coach</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#000;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;font-size:15px}
  .container{max-width:600px;margin:0 auto;padding:20px 16px 60px}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .header h1{margin:0;font-size:1.3rem;font-weight:700;letter-spacing:-0.02em}
  .back-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#e8e8e8;padding:8px 14px;border-radius:20px;font-size:0.85rem;cursor:pointer;text-decoration:none;font-family:inherit}
  .section{margin-bottom:24px}
  .section h2{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:#666;font-weight:600;margin:0 0 10px;padding:0 4px}
  .card{background:#0f0f0f;border:1px solid #1f1f1f;border-radius:14px;padding:16px;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1a1a1a;gap:14px}
  .row:last-child{border-bottom:none}
  .row-label{color:#888;font-size:0.85rem}
  .row-value{color:#ddd;font-size:0.92rem;font-weight:500;text-align:right}
  .row-value.green{color:#4ade80}.row-value.red{color:#f87171}.row-value.yellow{color:#facc15}
  label{display:block;font-size:0.85rem;color:#aaa;margin-bottom:6px;font-weight:500}
  input,select{width:100%;padding:11px 13px;font-size:0.95rem;background:#0a0a0a;border:1px solid #1f1f1f;border-radius:8px;color:#fff;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:#4ade80}
  .form-row{margin-bottom:12px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:inline-block;padding:10px 16px;border-radius:8px;font-weight:600;font-size:0.88rem;border:none;cursor:pointer;font-family:inherit;text-decoration:none}
  .btn-primary{background:#4ade80;color:#000}
  .btn-secondary{background:#1a1a1a;color:#fff;border:1px solid #2a2a2a}
  .btn-danger{background:transparent;color:#f87171;border:1px solid #5a2828}
  .btn:active{transform:scale(0.97)}
  .saved{color:#4ade80;font-size:0.78rem;margin-left:8px;opacity:0;transition:opacity 0.3s}
  .saved.show{opacity:1}
  .danger-zone{margin-top:32px;padding:16px;border:1px dashed #5a2828;border-radius:12px}
  .danger-zone h3{color:#f87171;margin:0 0 8px;font-size:0.95rem}
  .danger-zone p{color:#888;font-size:0.85rem;margin:0 0 14px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚙ Settings</h1>
    <a class="back-btn" href="/dashboard">← Dashboard</a>
  </div>

  <div class="section">
    <h2>Account</h2>
    <div class="card">
      <div class="row"><div class="row-label">Email</div><div class="row-value" id="email">—</div></div>
      <div class="row"><div class="row-label">Name</div><div class="row-value" id="name">—</div></div>
      <div class="row"><div class="row-label">Plan</div><div class="row-value" id="tier">—</div></div>
      <div class="row"><div class="row-label">Status</div><div class="row-value" id="status">—</div></div>
    </div>
    <div style="margin-top:10px"><a class="btn btn-secondary" href="/billing/portal">Manage billing →</a></div>
  </div>

  <div class="section">
    <h2>Connected Accounts</h2>
    <div class="card">
      <div class="row">
        <div class="row-label">WHOOP</div>
        <div><span id="whoop-status" class="row-value">—</span> <a class="btn btn-secondary" id="whoop-btn" href="/integrations/whoop/connect">Reconnect</a></div>
      </div>
      <div class="row">
        <div class="row-label">Strava</div>
        <div><span id="strava-status" class="row-value">—</span> <a class="btn btn-secondary" id="strava-btn" href="/integrations/strava/connect">Reconnect</a></div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Benchmarks <span class="saved" id="bSaved">✓ saved</span></h2>
    <div class="card">
      <div class="form-grid">
        <div class="form-row">
          <label>FTP (watts)</label>
          <input type="number" id="ftp_watts" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>Max HR</label>
          <input type="number" id="max_hr" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>LTHR</label>
          <input type="number" id="lthr" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>Bodyweight (kg)</label>
          <input type="number" step="0.1" id="bodyweight_kg" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>RHR baseline</label>
          <input type="number" id="rhr_baseline" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>HRV baseline</label>
          <input type="number" step="0.1" id="hrv_baseline" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>Squat 1RM (lb)</label>
          <input type="number" id="squat_1rm_lb" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>Deadlift 1RM (lb)</label>
          <input type="number" id="deadlift_1rm_lb" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>Bench 1RM (lb)</label>
          <input type="number" id="bench_1rm_lb" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>Weekly hours</label>
          <input type="number" step="0.5" id="weekly_hours_target" onblur="saveBenchmarks()">
        </div>
        <div class="form-row">
          <label>Strength/week</label>
          <select id="strength_target_per_week" onchange="saveBenchmarks()">
            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
          </select>
        </div>
        <div class="form-row">
          <label>Primary focus</label>
          <select id="primary_focus" onchange="saveBenchmarks()">
            <option value="cycling">Cycling</option>
            <option value="cycling-balanced">Cycling + strength</option>
            <option value="general">General fitness</option>
            <option value="aerobic_base">Aerobic base</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Event Mode</h2>
    <div class="card">
      <div class="form-row"><label>Event name</label><input type="text" id="current_event_name" placeholder="e.g. Iron Horse Bicycle Classic" onblur="saveBenchmarks()"></div>
      <div class="form-grid">
        <div class="form-row"><label>Date</label><input type="date" id="current_event_date" onblur="saveBenchmarks()"></div>
        <div class="form-row">
          <label>Type</label>
          <select id="current_event_type" onchange="saveBenchmarks()">
            <option value="">—</option>
            <option value="road">Road</option>
            <option value="gravel">Gravel</option>
            <option value="mtb">MTB</option>
            <option value="gran_fondo">Gran Fondo</option>
            <option value="crit">Crit</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Distance (km)</label><input type="number" step="0.5" id="current_event_distance_km" onblur="saveBenchmarks()"></div>
        <div class="form-row"><label>Elevation (m)</label><input type="number" id="current_event_elevation_m" onblur="saveBenchmarks()"></div>
      </div>
    </div>
  </div>

  <div class="danger-zone">
    <h3>Sign out</h3>
    <p>You can sign back in anytime with a new email link.</p>
    <a class="btn btn-danger" href="/auth/logout">Sign out</a>
  </div>
</div>

<script>
let data = null;

async function load(){
  try {
    const r = await fetch('/api/data');
    if (r.status === 401) { window.location = '/login'; return; }
    data = await r.json();
    render();
  } catch(e) { alert('Error loading: ' + e.message); }
}

function render(){
  document.getElementById('email').textContent = data.user.email;
  document.getElementById('name').textContent = data.user.name || '—';
  document.getElementById('tier').textContent = data.user.tier || 'Free';
  const status = data.user.status || 'inactive';
  const sEl = document.getElementById('status');
  sEl.textContent = status;
  sEl.className = 'row-value ' + (status === 'active' ? 'green' : status === 'trialing' ? 'yellow' : 'red');

  const whoop = data.connections?.whoop;
  const wEl = document.getElementById('whoop-status');
  if (whoop?.status === 'connected') { wEl.textContent = '✓ Connected'; wEl.classList.add('green'); }
  else { wEl.textContent = '✗ Disconnected'; wEl.classList.add('red'); }
  const strava = data.connections?.strava;
  const sEl2 = document.getElementById('strava-status');
  if (strava?.status === 'connected') { sEl2.textContent = '✓ Connected'; sEl2.classList.add('green'); }
  else { sEl2.textContent = '✗ Disconnected'; sEl2.classList.add('red'); }

  const b = data.benchmarks || {};
  ['ftp_watts','max_hr','lthr','bodyweight_kg','rhr_baseline','hrv_baseline','squat_1rm_lb','deadlift_1rm_lb','bench_1rm_lb','weekly_hours_target','strength_target_per_week','primary_focus','current_event_name','current_event_date','current_event_type','current_event_distance_km','current_event_elevation_m'].forEach(k => {
    const el = document.getElementById(k);
    if (el && b[k] != null) el.value = b[k];
  });
}

async function saveBenchmarks(){
  const payload = {};
  ['ftp_watts','max_hr','lthr','bodyweight_kg','rhr_baseline','hrv_baseline','squat_1rm_lb','deadlift_1rm_lb','bench_1rm_lb','weekly_hours_target','strength_target_per_week','primary_focus','current_event_name','current_event_date','current_event_type','current_event_distance_km','current_event_elevation_m'].forEach(k => {
    const el = document.getElementById(k);
    if (!el) return;
    const v = el.value;
    if (v === '') {
      payload[k] = null;
    } else if (['ftp_watts','max_hr','lthr','rhr_baseline','squat_1rm_lb','deadlift_1rm_lb','bench_1rm_lb','strength_target_per_week','current_event_elevation_m'].includes(k)) {
      payload[k] = parseInt(v);
    } else if (['bodyweight_kg','hrv_baseline','weekly_hours_target','current_event_distance_km'].includes(k)) {
      payload[k] = parseFloat(v);
    } else {
      payload[k] = v;
    }
  });
  try {
    await fetch('/onboarding/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const s = document.getElementById('bSaved');
    s.classList.add('show');
    setTimeout(() => s.classList.remove('show'), 1500);
  } catch(e) { console.error(e); }
}

load();
</script>
</body>
</html>
