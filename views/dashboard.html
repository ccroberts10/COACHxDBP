<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DBP Coach</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAFAF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  /* CORE PALETTE */
  --ink: #0A0A0A;
  --paper: #FAFAF7;
  --bone: #EFEDE5;
  --hi-vis: #F2E600;

  /* SEMANTIC (kept for physiological state — culturally locked) */
  --rec-green: #1F4A2C;
  --rec-yellow: #D4A82E;
  --rec-red: #6B1F2A;
  --info-blue: #6B92B5;

  /* LOWER ANIMAS — earth tones */
  --la-brown: #3D2817;
  --la-tan: #C4A574;
  --la-rust: #B8542C;

  /* GRID + LINES */
  --line: rgba(10,10,10,0.10);
  --line-strong: rgba(10,10,10,0.20);
  --muted: rgba(10,10,10,0.50);
  --muted-soft: rgba(10,10,10,0.35);

  /* TYPE — placeholders. Maxi swaps in here when licensed. */
  --maxi-round: 'Bricolage Grotesque', 'Maxi Round', system-ui, sans-serif;
  --maxi-sharp: 'Bricolage Grotesque', 'Maxi Sharp', system-ui, sans-serif;
  --maxi-mono: 'DM Mono', 'Maxi Round Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bone); color: var(--ink); font-family: var(--maxi-mono); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* ============= LAYOUT ============= */
.container { max-width: 600px; margin: 0 auto; padding: 24px 20px 120px; }

/* ============= HEADER ============= */
.header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line-strong);
  margin-bottom: 28px;
}
.header-l { display: flex; flex-direction: column; gap: 6px; }
.brand {
  font-family: var(--maxi-round);
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  line-height: 0.9;
}
.brand .accent {
  background: var(--hi-vis);
  padding: 0 4px;
  margin-left: 2px;
}
.header-meta {
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn-icon {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  background: var(--paper); border: 1px solid var(--line-strong);
  font-size: 1rem; cursor: pointer; font-family: inherit;
}
.btn-icon:active { transform: scale(0.96); }
.btn-run {
  font-family: var(--maxi-mono);
  font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500;
  background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
  padding: 10px 16px; cursor: pointer;
}
.btn-run:disabled { opacity: 0.5; cursor: wait; }
.btn-run:active { transform: scale(0.97); }

/* ============= SECTION HEADERS ============= */
.section { margin-bottom: 28px; }
.section-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.section-header .section-num { color: var(--muted); }
.section-header .section-name { font-weight: 500; }
.section-header .section-meta { color: var(--muted); }

/* ============= RECOVERY HERO ============= */
.recovery-hero {
  background: var(--ink);
  color: var(--paper);
  padding: 28px 24px 24px;
  position: relative;
  overflow: hidden;
}
.recovery-hero.green { background: var(--rec-green); }
.recovery-hero.yellow { background: var(--rec-yellow); color: var(--ink); }
.recovery-hero.red { background: var(--rec-red); }
.recovery-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 18px;
}
.recovery-pct {
  font-family: var(--maxi-round);
  font-weight: 800;
  font-size: 5rem;
  line-height: 0.85;
  letter-spacing: -0.04em;
}
.recovery-pct .pct-sign { font-size: 1.8rem; vertical-align: top; margin-left: 4px; opacity: 0.6; }
.recovery-state {
  font-family: var(--maxi-mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 8px;
  opacity: 0.6;
}
.recovery-headline {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.18);
  font-family: var(--maxi-round);
  font-weight: 700;
  font-size: 1.1rem;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.recovery-hero.yellow .recovery-headline { border-top-color: rgba(0,0,0,0.18); }

/* ============= STAT GRID ============= */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin-top: 14px;
}
.stat-tile {
  background: var(--paper);
  padding: 16px 12px;
  text-align: left;
}
.stat-label {
  font-family: var(--maxi-mono);
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.stat-value {
  font-family: var(--maxi-round);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  line-height: 1;
}
.stat-sub {
  font-family: var(--maxi-mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-top: 4px;
  text-transform: uppercase;
}
.stat-arrow { font-size: 0.7rem; margin-left: 4px; vertical-align: middle; }
.arrow-up { color: var(--rec-green); }
.arrow-down { color: var(--rec-red); }
.arrow-flat { color: var(--muted); }

/* ============= WEATHER ============= */
.weather-strip {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 12px 16px;
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}
.weather-now {
  font-family: var(--maxi-sharp);
  font-weight: 700;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.weather-now .temp { font-family: var(--maxi-round); font-size: 1.4rem; margin-right: 10px; letter-spacing: -0.02em; }
.weather-meta {
  font-family: var(--maxi-mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  text-align: right;
}
.weather-forecast {
  display: flex;
  gap: 4px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  grid-column: 1 / -1;
}
.weather-forecast > div {
  flex: 1;
  text-align: center;
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.05em;
}
.weather-forecast .f-time { color: var(--muted); }
.weather-forecast .f-temp { font-family: var(--maxi-round); font-weight: 700; font-size: 0.9rem; margin: 2px 0; letter-spacing: -0.01em; }
.weather-forecast .f-precip { color: var(--info-blue); font-size: 0.6rem; }

/* ============= CHECK-IN CARD ============= */
.checkin-card {
  background: var(--paper);
  border: 1px solid var(--line-strong);
  padding: 20px;
  margin-top: 4px;
}
.checkin-card.complete {
  background: var(--paper);
  border-left: 4px solid var(--hi-vis);
}
.checkin-title {
  font-family: var(--maxi-round);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.checkin-sub {
  font-family: var(--maxi-mono);
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin-bottom: 18px;
  line-height: 1.5;
}
.checkin-row { margin-bottom: 16px; }
.checkin-row:last-of-type { margin-bottom: 0; }
.checkin-row-label {
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  font-weight: 500;
}
.checkin-options { display: flex; gap: 6px; flex-wrap: wrap; }
.opt {
  flex: 1;
  min-width: 0;
  padding: 10px 6px;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  font-family: var(--maxi-mono);
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  transition: all 0.12s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.opt:active { transform: scale(0.97); }
.opt.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.opt.selected.warning { background: var(--rec-yellow); color: var(--ink); border-color: var(--rec-yellow); }
.opt.selected.danger { background: var(--rec-red); color: var(--paper); border-color: var(--rec-red); }
.opt-icon {
  display: block;
  font-size: 1rem;
  margin-bottom: 2px;
  line-height: 1;
}
.checkin-note {
  width: 100%;
  background: var(--bone);
  border: 1px solid var(--line);
  padding: 10px 12px;
  font-size: 0.85rem;
  font-family: var(--maxi-mono);
  resize: none;
  margin-top: 6px;
  color: var(--ink);
}
.checkin-note:focus { outline: none; border-color: var(--ink); }
.garmin-inputs {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}
.garmin-input {
  flex: 1;
}
.garmin-label {
  display: block;
  font-family: var(--maxi-mono);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(10,10,10,0.55);
  margin-bottom: 4px;
}
.garmin-input input {
  width: 100%;
  background: var(--bone);
  border: 1px solid var(--line);
  padding: 10px 12px;
  font-size: 0.95rem;
  font-family: var(--maxi-mono);
  color: var(--ink);
  text-align: center;
}
.garmin-input input:focus { outline: none; border-color: var(--ink); }

.checkin-gate-notice {
  background: var(--ink);
  color: var(--paper);
  padding: 18px 20px;
  margin-bottom: 14px;
}
.cgn-title {
  font-family: var(--maxi-mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  font-weight: 700;
  color: var(--hi-vis);
  margin-bottom: 8px;
}
.cgn-body {
  font-family: var(--maxi-mono);
  font-size: 0.85rem;
  line-height: 1.55;
  opacity: 0.88;
}
.btn-save {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  background: var(--hi-vis);
  color: var(--ink);
  border: 1px solid var(--ink);
  font-family: var(--maxi-mono);
  font-weight: 500;
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
}
.btn-save:active { transform: scale(0.98); }
.btn-save:disabled { opacity: 0.5; cursor: wait; }
.btn-save.saved { background: var(--rec-green); color: var(--paper); border-color: var(--rec-green); }

.checkin-summary {
  font-family: var(--maxi-mono);
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  line-height: 1.7;
  color: var(--ink);
}
.checkin-summary .label { color: var(--muted); margin-right: 4px; }
.checkin-summary .value { font-weight: 500; text-transform: uppercase; }
.checkin-edit {
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}
.checkin-summary-note {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--bone);
  font-size: 0.78rem;
  color: var(--muted);
  font-style: italic;
  border-left: 2px solid var(--line-strong);
}

/* ============= WORKOUT CARD ============= */
.workout-card {
  background: var(--paper);
  border: 1px solid var(--line-strong);
  padding: 0;
  overflow: hidden;
}
.workout-header {
  background: var(--ink);
  color: var(--paper);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.workout-header .modality {
  font-family: var(--maxi-round);
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.workout-header .specs {
  font-family: var(--maxi-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.7;
}
.workout-body { padding: 20px; }
.workout-tags {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.workout-tag {
  font-family: var(--maxi-mono);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--bone);
  padding: 5px 9px;
  border: 1px solid var(--line);
}
.workout-detail {
  font-family: var(--maxi-mono);
  font-size: 0.92rem;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--ink);
}
.workout-route, .workout-skip {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-family: var(--maxi-mono);
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.workout-skip { color: var(--rec-red); }

/* ============= FEEDBACK ============= */
.feedback {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line-strong);
}
.feedback-label {
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.feedback-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.fb-btn {
  padding: 12px 6px;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  font-family: var(--maxi-mono);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
}
.fb-btn:active { transform: scale(0.97); }
.fb-btn.active.did_it { background: var(--rec-green); color: var(--paper); border-color: var(--rec-green); }
.fb-btn.active.modified { background: var(--rec-yellow); color: var(--ink); border-color: var(--rec-yellow); }
.fb-btn.active.skipped { background: var(--rec-red); color: var(--paper); border-color: var(--rec-red); }
.fb-details { margin-top: 14px; display: none; }
.fb-details.show { display: block; }
.fb-detail-label {
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 14px 0 8px;
  font-weight: 500;
}
.fb-detail-label:first-child { margin-top: 0; }
.pill-options { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 9px 12px;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  font-family: var(--maxi-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
}
.pill:active { transform: scale(0.95); }
.pill.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rpe-wrap { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
.rpe-slider {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 4px; background: var(--ink); border-radius: 0; outline: none;
}
.rpe-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 28px; height: 28px; background: var(--hi-vis); cursor: pointer;
  border: 2px solid var(--ink); border-radius: 0;
}
.rpe-slider::-moz-range-thumb {
  width: 28px; height: 28px; background: var(--hi-vis); cursor: pointer;
  border: 2px solid var(--ink); border-radius: 0;
}
.rpe-value {
  font-family: var(--maxi-round);
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -0.02em;
  min-width: 44px;
  text-align: center;
  background: var(--ink);
  color: var(--hi-vis);
  padding: 4px 8px;
}

/* ============= NUTRITION ============= */
.nutrition-card {
  background: var(--paper);
  border: 1px solid var(--line-strong);
}
.nutrition-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-family: var(--maxi-mono);
  font-size: 0.85rem;
}
.nutrition-row:last-child { border-bottom: none; }
.nutrition-row .label {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  align-self: start;
  padding-top: 2px;
}
.nutrition-row .value { line-height: 1.55; }

/* ============= RATIONALE ============= */
.rationale {
  background: var(--paper);
  border: 1px solid var(--line-strong);
  border-left: 4px solid var(--info-blue);
  padding: 16px 18px;
  font-family: var(--maxi-mono);
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--ink);
}

/* ============= FLAGS ============= */
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag {
  background: var(--rec-red);
  color: var(--paper);
  padding: 5px 9px;
  font-family: var(--maxi-mono);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ============= PERKS ============= */
.perks-card {
  background: var(--hi-vis);
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: 18px 20px;
}
.perks-card h3 {
  font-family: var(--maxi-round);
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.perk-item {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(10,10,10,0.2);
}
.perk-item:last-child { border-bottom: none; }
.perk-info { flex: 1; }
.perk-info strong {
  font-family: var(--maxi-round); font-weight: 700;
  display: block;
  font-size: 0.9rem;
  letter-spacing: -0.01em;
  margin-bottom: 2px;
  text-transform: uppercase;
}
.perk-info span {
  font-family: var(--maxi-mono);
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  color: rgba(10,10,10,0.6);
}
.perk-code {
  background: var(--ink);
  color: var(--hi-vis);
  padding: 8px 12px;
  font-family: var(--maxi-mono);
  font-weight: 500;
  font-size: 0.95rem;
  letter-spacing: 0.05em;
}

/* ============= MEMBER REWARDS NEW UI ============= */
.member-code-hero {
  background: var(--ink);
  color: var(--paper);
  padding: 18px;
  margin: -18px -20px 16px -20px;
  text-align: center;
}
.member-code-hero .mch-label {
  font-family: var(--maxi-mono);
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  color: rgba(250,250,247,0.6);
  margin-bottom: 6px;
}
.member-code-hero .mch-code {
  font-family: var(--maxi-round);
  font-weight: 800;
  font-size: 2rem;
  letter-spacing: -0.02em;
  color: var(--hi-vis);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.member-code-hero .mch-sub {
  font-family: var(--maxi-mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  color: rgba(250,250,247,0.55);
  margin-top: 8px;
  text-transform: uppercase;
}

.mch-qr-btn {
  display: inline-block;
  margin-top: 14px;
  padding: 10px 18px;
  font-family: var(--maxi-mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink);

<!-- QRious: tiny QR code library, ~6KB minified -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
function showMemberQR() {
  const code = appData?.user?.member_code;
  const name = appData?.user?.name || 'Member';
  if (!code) { alert('Member code not yet generated. Refresh and try again.'); return; }
  document.getElementById('qrModalTitle').textContent = 'Member QR';
  document.getElementById('qrModalName').textContent = name;
  document.getElementById('qrModalCode').textContent = code;
  document.getElementById('qrModalInstruction').textContent = "Show this to DBP staff at checkout. They'll scan it.";
  document.getElementById('qrModal').classList.add('show');
  // Generate QR
  try {
    new QRious({
      element: document.getElementById('memberQrCanvas'),
      value: code,
      size: 240,
      level: 'H',                 // High error correction (works through scratched phone screens)
      foreground: '#0A0A0A',
      background: '#FFFFFF',
    });
  } catch (e) {
    console.error('QR generation failed:', e);
  }
}

function showRewardQR(code, description) {
  if (!code) return;
  document.getElementById('qrModalTitle').textContent = 'Reward QR';
  document.getElementById('qrModalName').textContent = description || 'Reward';
  document.getElementById('qrModalCode').textContent = code;
  document.getElementById('qrModalInstruction').textContent = "Show at checkout. Staff will scan to redeem.";
  document.getElementById('qrModal').classList.add('show');
  try {
    new QRious({
      element: document.getElementById('memberQrCanvas'),
      value: code,
      size: 240,
      level: 'H',
      foreground: '#0A0A0A',
      background: '#FFFFFF',
    });
  } catch (e) {
    console.error('QR generation failed:', e);
  }
}

function hideMemberQR() {
  document.getElementById('qrModal').classList.remove('show');
}
</script>

<script>
let appData = null;
let pendingFeedback = { status: null, rpe: 7, actual_workout_type: null, actual_workout_detail: '', skip_reason: null, note: '' };
let pendingCheckin = { sleep_quality: null, legs_feel: null, alcohol_drinks: null, stress_level: null, note: '', garmin_sleep_score: null, garmin_body_battery: null };

function _toDate(s) {
  if (!s) return null;
  // If it's already a Date, return as-is
  if (s instanceof Date) return s;
  // If it's an ISO timestamp (has 'T'), parse directly
  if (typeof s === 'string' && s.includes('T')) return new Date(s);
  // If it's just YYYY-MM-DD, parse at noon to avoid timezone drift
  if (typeof s === 'string') return new Date(s + 'T12:00:00');
  return new Date(s);
}
function fmtDate(s){const d=_toDate(s);return d&&!isNaN(d)?d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}):'—'}
function fmtShortDate(s){const d=_toDate(s);return d&&!isNaN(d)?d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'}):'—'}
function fmtDay(s){const d=_toDate(s);return d&&!isNaN(d)?d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,3).toUpperCase():'—'}
function recColor(p){return p>=67?'green':p>=34?'yellow':'red'}
function recState(p){return p>=67?'Recovered':p>=34?'Caution':'Strain'}
function arrow(curr,base){if(curr==null||base==null)return'';const d=curr-base;if(Math.abs(d)<base*0.02)return'<span class="stat-arrow arrow-flat">→</span>';return d>0?'<span class="stat-arrow arrow-up">▲</span>':'<span class="stat-arrow arrow-down">▼</span>'}
function todayStr(){return appData?.today_date || new Date().toLocaleDateString('en-CA')}

function dismissRewardBanner() {
  const seen = JSON.parse(localStorage.getItem('seen_reward_codes') || '[]');
  (appData.perks || []).forEach(p => { if (!p.redeemed_at && !seen.includes(p.code)) seen.push(p.code); });
  // Cap at 100 to avoid runaway storage
  localStorage.setItem('seen_reward_codes', JSON.stringify(seen.slice(-100)));
  const banner = document.getElementById('rewardBanner');

async function loadData(){
  document.getElementById('loadingView').style.display='block';

  // Rotate through messages while loading — gives the AI generation wait a "thinking" feel
  const loadingMessages = [
    'Reading your latest data',
    'Pulling recovery from WHOOP',
    'Analyzing recent training load',
    'Building today\'s prescription',
    'Almost ready',
  ];
  let msgIdx = 0;
  const msgEl = document.getElementById('loadingMessage');
  msgEl.textContent = loadingMessages[0];
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % loadingMessages.length;
    if (msgEl) msgEl.textContent = loadingMessages[msgIdx];
  }, 2500);

  try{
    const r = await fetch('/api/data');
    if (r.status === 401) { clearInterval(msgInterval); window.location = '/login'; return; }
    if (r.status === 402) {
      // Subscription required — redirect to billing
      clearInterval(msgInterval);
      const errData = await r.json();
      document.getElementById('loadingView').innerHTML =
        '<div style="text-align:center;padding:40px;font-family:var(--maxi-mono)">' +
        '<div style="margin-bottom:16px">SUBSCRIPTION REQUIRED</div>' +
        '<div style="font-size:0.85rem;opacity:0.6;margin-bottom:20px">Status: ' + (errData.status || 'unknown') + '</div>' +
        '<a href="/" style="color:var(--ink);text-decoration:underline">← Back to home</a>' +
        '</div>';
      return;
    }
    appData = await r.json();

    // Defensive defaults — make sure all expected arrays exist even if API returned partial data
    appData.snapshots = appData.snapshots || [];
    appData.prescriptions = appData.prescriptions || [];
    appData.activities = appData.activities || [];
    appData.checkins = appData.checkins || [];
    appData.perks = appData.perks || [];

    if (appData.today_checkin) {
      pendingCheckin = {
        sleep_quality: appData.today_checkin.sleep_quality,
        legs_feel: appData.today_checkin.legs_feel,
        alcohol_drinks: appData.today_checkin.alcohol_drinks,
        stress_level: appData.today_checkin.stress_level,
        note: appData.today_checkin.note || '',
        garmin_sleep_score: appData.today_checkin.garmin_sleep_score ?? null,
        garmin_body_battery: appData.today_checkin.garmin_body_battery ?? null,
      };
    }
    renderAll();

    // Free + Rewards: hide Trends/History tabs and Run button (no prescription data exists for these tiers)
    // This is a belt-and-suspenders check; renderToday() also hides these, but it ensures clean initial render.
    const tier = appData.user?.tier;
    if (tier === 'free' || tier === 'rewards') {
      document.querySelectorAll('.tab[data-view="trends"], .tab[data-view="history"]').forEach(t => t.style.display = 'none');
      const runBtn = document.getElementById('refreshBtn');
      if (runBtn) runBtn.style.display = 'none';
    }
  }catch(e){
    clearInterval(msgInterval);
    document.getElementById('loadingView').innerHTML = '<div style="color:var(--rec-red)">Error: '+e.message+'</div>';
    return;
  }
  clearInterval(msgInterval);
  document.getElementById('loadingView').style.display='none';
}

async function runRefresh(){

async function saveCheckin(){
  const btn = document.getElementById('checkinSaveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const r = await fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        date: todayStr(),
        sleep_quality: pendingCheckin.sleep_quality,
        legs_feel: pendingCheckin.legs_feel,
        alcohol_drinks: pendingCheckin.alcohol_drinks,
        stress_level: pendingCheckin.stress_level,
        note: pendingCheckin.note,
        garmin_sleep_score: pendingCheckin.garmin_sleep_score,
        garmin_body_battery: pendingCheckin.garmin_body_battery,
      }),
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error || 'Save failed');

    // If the backend generated a prescription post-checkin (Strava-only user just unlocked their day),
    // reload all dashboard data to render the fresh prescription.
    if (data.prescription_generated) {
      btn.textContent = '✓ Generating today\'s plan…';
      // Full reload — picks up the new prescription
      await loadData();
      return;
    }

    btn.textContent = '✓ Saved';
    btn.classList.add('saved');
    appData.today_checkin = { ...pendingCheckin, date: todayStr() };
    window._editCheckin = false;
    setTimeout(() => renderToday(), 700);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Save check-in';
    alert('Save failed: ' + e.message);
  }
}

function renderToday(){
  const el = document.getElementById('todayContent');
  const tier = appData.user?.tier;

  // Hide Trends + History tabs for non-Coach users (they have no prescription data)
  document.querySelectorAll('.coach-tab').forEach(t => {
    t.style.display = (tier === 'coach') ? '' : 'none';
  });

  if (runBtn) runBtn.style.display = (tier === 'coach') ? '' : 'none';

  // FREE + REWARDS TIERS — simplified dashboard: member code, punch card, streak, perks
  // (Both have no Coach access — no prescription, no Strava/WHOOP data)
  if (tier === 'free' || tier === 'rewards') {
    el.innerHTML = renderFreeDashboard(tier);
    return;
  }

  const snap = appData.snapshots[0];
  const presc = appData.prescriptions[0];

  // Strava-only user without check-in — gate prescription on check-in
  if (appData.needs_checkin) {
    el.innerHTML = `
      <div class="section">
        ${sectionHeader('01', 'Daily Check-in', 'REQUIRED')}
        <div class="checkin-gate-notice">
          <div class="cgn-title">CHECK IN TO UNLOCK TODAY</div>

        </div>
        ${renderCheckinCard()}
      </div>`;
    return;
  }

  if(!snap || !presc){
    el.innerHTML = `
      <div class="section">
        ${sectionHeader('01', 'Daily Check-in', '')}
        ${renderCheckinCard()}
      </div>
      <div class="empty">
        <strong>No prescription yet</strong>

  const p = presc.full_response;

  // Detect if user has WHOOP connected (snapshot has recovery_pct or hrv data)
  const hasWhoop = snap.recovery_pct != null || snap.hrv != null;

  // For Strava-only users, derive a soft inferred recovery from check-in
  let inferredRecovery = null;
  if (!hasWhoop && appData.today_checkin) {
    const c = appData.today_checkin;
    const legsScore = { fresh: 4, normal: 3, heavy: 2, trashed: 1 }[c.legs_feel] || 3;
    const sleepScore = c.sleep_quality || 3;
    let score = (legsScore * 20) + (sleepScore * 10);
    if (c.alcohol_drinks >= 4) score -= 30;
    else if (c.alcohol_drinks >= 2) score -= 15;
    if (c.stress_level === 'high') score -= 10;
    inferredRecovery = Math.max(15, Math.min(95, score));
  }

  const displayRec = hasWhoop ? snap.recovery_pct : inferredRecovery;
  const recoveryLabel = hasWhoop ? 'WHOOP Recovery' : (inferredRecovery != null ? 'Inferred Recovery' : 'Connect WHOOP or Check In');

  const recCol = recColor(displayRec ?? 0);
  const recStateLabel = recState(displayRec ?? 0);
  const acStatus = snap.acute_chronic_ratio < 0.8 ? 'detraining' : snap.acute_chronic_ratio < 1.3 ? 'optimal' : snap.acute_chronic_ratio < 1.5 ? 'building' : 'overreaching';

  // Sync pendingFeedback to this prescription's feedback only when the date changes.
  // This means: yesterday's typed-but-unsaved notes don't carry into today,
  // but today's in-progress typing isn't wiped on every re-render.
  if (window._lastFeedbackDate !== presc.date) {
    window._lastFeedbackDate = presc.date;
    window._editFeedback = false;
    if (presc.feedback) {
      pendingFeedback = {
        status: presc.feedback.status,
        rpe: presc.feedback.rpe || 7,
        actual_workout_type: presc.feedback.actual_workout_type || null,
        actual_workout_detail: presc.feedback.actual_workout_detail || '',
        skip_reason: presc.feedback.skip_reason || null,

      };
    } else {
      pendingFeedback = { status: null, rpe: 7, actual_workout_type: null, actual_workout_detail: '', skip_reason: null, note: '' };
    }
  }

  let perksHtml = '';
  const savings = appData.savings || {};
  const punch = appData.punch;
  const streak = appData.streak;
  const memberCode = appData.user?.member_code;
  const hasMembership = ['rewards', 'coach'].includes(appData.user?.tier);
  const hasSavings = (savings.month_cents || 0) > 0 || (savings.lifetime_cents || 0) > 0;
  const hasPerks = appData.perks?.length > 0;

  if (hasMembership) {
    // Build the member rewards card
    const punchDots = punch ? Array.from({length: 10}, (_, i) =>
      `<span class="punch-dot${i < (punch.current||0) ? ' filled' : ''}"></span>`).join('') : '';

    const streakNext = streak?.next_milestone;
    const streakLabel = streak?.current
      ? `${streak.current} day${streak.current === 1 ? '' : 's'}${streakNext ? ` · ${streakNext - streak.current} more for ${streak.next_milestone_reward}` : ''}`
      : 'Check in to start';

    perksHtml = `<div class="section">
      ${sectionHeader('05', 'Member Rewards', hasPerks ? `${appData.perks.length} active` : '')}
      <div class="perks-card">

        <!-- Member Code Hero -->
        ${memberCode ? `
        <div class="member-code-hero">
          <div class="mch-label">YOUR MEMBER CODE</div>
          <div class="mch-code">${memberCode}</div>
          <div class="mch-sub">Show at DBP for purchases · earn punches · redeem rewards</div>
          <button class="mch-qr-btn" onclick="showMemberQR()">📱 Show QR Code</button>
        </div>` : ''}

        <!-- Punch + Streak Row -->
        ${(punch || streak) ? `
        <div class="rewards-stat-row">
          ${punch ? `
          <div class="rewards-stat">
            <div class="rs-label">Punch Card</div>
            <div class="rs-value">${punch.current || 0}<span class="rs-sub">/10</span></div>
            <div class="punch-bar">${punchDots}</div>
            <div class="rs-meta">${(punch.away_from_free || 10) === 0 ? '🎉 Free drink ready!' : (punch.away_from_free || 10) + ' away from free drink'}</div>
          </div>` : ''}
          ${streak ? `
          <div class="rewards-stat">
            <div class="rs-label">Check-in Streak</div>
            <div class="rs-value">${streak.current || 0}<span class="rs-sub">days</span></div>
            <div class="rs-meta">${streakLabel}</div>
          </div>` : ''}
        </div>` : ''}

        <!-- Savings Numbers -->
        ${hasSavings ? `
        <div class="rewards-savings">
          <div>
            <div class="rs-label">Saved this month</div>
            <div class="rs-value-big">$${((savings.month_cents||0)/100).toFixed(2)}</div>
          </div>
          ${(savings.lifetime_cents||0) > (savings.month_cents||0) ? `
          <div style="text-align:right">
            <div class="rs-label">Lifetime</div>
            <div class="rs-value-mid">$${((savings.lifetime_cents||0)/100).toFixed(2)}</div>
          </div>` : ''}
        </div>` : ''}

        <!-- Active Rewards List -->
        ${hasPerks ? `
        <div class="rewards-active-list">
          <div style="font-family:var(--maxi-mono);font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(10,10,10,0.6);margin-bottom:8px">${appData.perks.length} ACTIVE REWARD${appData.perks.length > 1 ? 'S' : ''}</div>
          ${appData.perks.map(perk => `<div class="perk-item">
            <div class="perk-info"><strong>${perk.description||perk.perk_type}</strong><span>Show at DBP · ${perk.expires_at?'expires '+new Date(perk.expires_at).toLocaleDateString():'no expiration'}</span></div>
            <div class="perk-actions">
              <div class="perk-code">${perk.code}</div>
              <button class="perk-qr-btn" onclick="showRewardQR('${perk.code}','${(perk.description||perk.perk_type||'').replace(/'/g,"\\'")}')">📱 QR</button>
            </div>
          </div>`).join('')}
        </div>` : ''}
      </div>
    </div>`;
  }

  // Detect new unseen rewards
  const seenCodes = JSON.parse(localStorage.getItem('seen_reward_codes') || '[]');
  const unseenRewards = (appData.perks || []).filter(p => !p.redeemed_at && !seenCodes.includes(p.code));
  let bannerHtml = '';
  if (unseenRewards.length > 0) {
    const r = unseenRewards[0]; // show top one
    const moreText = unseenRewards.length > 1 ? ` (+${unseenRewards.length - 1} more)` : '';
    bannerHtml = `
      <div class="reward-banner" id="rewardBanner">
        <div class="reward-banner-inner">
          <div>
            <div class="reward-banner-label">🎁 New Reward${moreText}</div>
            <div class="reward-banner-desc">${r.description || r.perk_type}</div>
          </div>
          <div class="reward-banner-code">${r.code}</div>
        </div>
        <button class="reward-banner-dismiss" onclick="dismissRewardBanner()" aria-label="Dismiss">×</button>
      </div>`;
  }

  el.innerHTML = `
    ${bannerHtml}
    <div class="section">
      ${sectionHeader('01', 'Recovery', recStateLabel.toUpperCase())}
      <div class="recovery-hero ${recCol}">
        <div class="recovery-meta">
          <span>Today / ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()}</span>
          <span>${recStateLabel}</span>
        </div>
        <div class="recovery-pct">${displayRec ?? '—'}<span class="pct-sign">%</span></div>
        <div class="recovery-state">${recoveryLabel}</div>
        ${p?.headline ? `<div class="recovery-headline">${p.headline}</div>` : ''}
      </div>

      ${hasWhoop ? `<div class="stat-grid">
        <div class="stat-tile"><div class="stat-label">HRV</div><div class="stat-value">${snap.hrv?.toFixed?.(0) ?? '—'}${arrow(snap.hrv, appData.benchmarks?.hrv_baseline)}</div><div class="stat-sub">ms · base ${appData.benchmarks?.hrv_baseline ?? '—'}</div></div>
        <div class="stat-tile"><div class="stat-label">RHR</div><div class="stat-value">${snap.rhr ?? '—'}${arrow(appData.benchmarks?.rhr_baseline, snap.rhr)}</div><div class="stat-sub">bpm · base ${appData.benchmarks?.rhr_baseline ?? '—'}</div></div>
        <div class="stat-tile"><div class="stat-label">Sleep</div><div class="stat-value">${snap.sleep_hours?.toFixed?.(1) ?? '—'}<span style="font-size:0.85rem">h</span></div><div class="stat-sub">${snap.deep_sleep_min ?? '—'} deep</div></div>
        <div class="stat-tile"><div class="stat-label">Strain Yest</div><div class="stat-value">${snap.yesterday_strain?.toFixed?.(1) ?? '—'}</div><div class="stat-sub">/ 21</div></div>
        <div class="stat-tile"><div class="stat-label">AC Ratio</div><div class="stat-value">${snap.acute_chronic_ratio ?? '—'}</div><div class="stat-sub">${acStatus}</div></div>
        <div class="stat-tile"><div class="stat-label">Wkly Avg</div><div class="stat-value">${snap.weekly_strain_avg?.toFixed?.(1) ?? '—'}</div><div class="stat-sub">strain</div></div>` : `<div class="stat-grid">
        <div class="stat-tile"><div class="stat-label">Legs Feel</div><div class="stat-value" style="font-size:1.2rem">${appData.today_checkin?.legs_feel || '—'}</div><div class="stat-sub">self-reported</div></div>
        <div class="stat-tile"><div class="stat-label">Sleep</div><div class="stat-value">${appData.today_checkin?.sleep_quality ?? '—'}<span style="font-size:0.85rem">/5</span></div><div class="stat-sub">self-reported</div></div>
        <div class="stat-tile"><div class="stat-label">Stress</div><div class="stat-value" style="font-size:1.2rem">${appData.today_checkin?.stress_level || '—'}</div><div class="stat-sub">self-reported</div></div>
        <div class="stat-tile"><div class="stat-label">AC Ratio</div><div class="stat-value">${snap.acute_chronic_ratio ?? '—'}</div><div class="stat-sub">${acStatus}</div></div>
        <div class="stat-tile"><div class="stat-label">Wkly Hrs</div><div class="stat-value">${snap.weekly_strain_avg?.toFixed?.(1) ?? '—'}</div><div class="stat-sub">avg load</div></div>
        <div class="stat-tile"><div class="stat-label">Drinks Last</div><div class="stat-value">${appData.today_checkin?.alcohol_drinks ?? '—'}</div><div class="stat-sub">last night</div></div>`}
      </div>

      ${appData.weather ? `
      <div class="weather-strip">
        <div class="weather-now"><span class="temp">${appData.weather.current.temp}°</span>${appData.weather.current.description}</div>
        <div class="weather-meta">Wind ${appData.weather.current.wind_mph}mph<br>Feels ${appData.weather.current.feels_like}°</div>
        ${appData.weather.next_12h?.length ? `<div class="weather-forecast">${appData.weather.next_12h.map(f => `<div><div class="f-time">${f.time}</div><div class="f-temp">${f.temp}°</div>${f.precip_chance_pct > 20 ? `<div class="f-precip">${f.precip_chance_pct}%💧</div>` : ''}</div>`).join('')}</div>` : ''}
      </div>` : ''}
    </div>

    <div class="section">
      ${sectionHeader('02', 'Daily Check-in', appData.today_checkin?'COMPLETE':'PENDING')}
      ${renderCheckinCard()}
    </div>

    ${perksHtml}

    ${p?.workout ? `
    <div class="section">
      ${sectionHeader('03', "Today's Workout", `${p.workout.duration_min || '—'} MIN · ${(p.workout.type || '—').toUpperCase()}`)}
      <div class="workout-card">
        <div class="workout-header">
          <span class="modality">${(p.workout.primary_modality || 'workout').toUpperCase()}</span>
          <span class="specs">${p.workout.duration_min ? p.workout.duration_min + ' min' : ''}</span>
        </div>
        <div class="workout-body">
          <div class="workout-tags">
            ${p.workout.intensity_zone ? '<span class="workout-tag">🎯 '+p.workout.intensity_zone+'</span>' : ''}
            ${p.workout.duration_min ? '<span class="workout-tag">⏱ '+p.workout.duration_min+'min</span>' : ''}
          </div>
          <div class="workout-detail">${p.workout.specific_workout || ''}</div>
          ${p.workout.route_suggestion ? `<div class="workout-route">📍 ${p.workout.route_suggestion}</div>` : ''}
          ${p.workout.alternates ? `<div class="workout-route"><strong style="font-weight:500;color:var(--ink);text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem">Alternates:</strong> ${p.workout.alternates}</div>` : ''}
          ${p.workout.skip_if ? `<div class="workout-skip">⚠ Skip if: ${p.workout.skip_if}</div>` : ''}

          <div class="feedback">
            ${renderFeedbackBlock(presc)}
          </div>
        </div>
      </div>
    </div>` : ''}

    ${p?.nutrition ? `
    <div class="section">
      ${sectionHeader('04', 'Nutrition', `${p.nutrition.hydration_target_oz || '—'} OZ WATER`)}
      <div class="nutrition-card">
        ${p.nutrition.pre_workout ? nutritionRow('Pre', p.nutrition.pre_workout) : ''}
        ${p.nutrition.intra_workout ? nutritionRow('Intra', p.nutrition.intra_workout) : ''}
        ${p.nutrition.post_workout ? nutritionRow('Post', p.nutrition.post_workout) : ''}
        ${nutritionRow('Breakfast', p.nutrition.breakfast)}
        ${nutritionRow('Lunch', p.nutrition.lunch)}
        ${nutritionRow('Dinner', p.nutrition.dinner)}
        ${nutritionRow('Supps', p.nutrition.supplements)}
      </div>
    </div>` : ''}

    ${p?.rationale ? `<div class="section">${sectionHeader('06', 'Why this prescription', '')}<div class="rationale">${p.rationale}</div></div>` : ''}

    ${p?.flags?.length ? `<div class="section">${sectionHeader('07', 'Flags', `${p.flags.length} ACTIVE`)}<div class="flags">${p.flags.map(f => '<span class="flag">⚠ '+f.replace(/_/g, ' ')+'</span>').join('')}</div></div>` : ''}
  `;
}

function renderFeedbackBlock(presc) {
  const fb = presc.feedback;
  // Show summary if feedback is saved AND user isn't editing
  if (fb && fb.status && !window._editFeedback) {
    const statusLabels = { did_it: '✓ Did it', modified: '⟳ Modified', skipped: '— Skipped' };
    const skipLabels = { too_tired: 'Too tired', no_time: 'No time', weather: 'Weather', sick: 'Sick / sore', other: 'Other' };
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="feedback-label">Workout feedback</div>
        <button class="checkin-edit" onclick="window._editFeedback=true; renderToday()">Edit →</button>
      </div>
      <div class="checkin-summary">
        <span class="value">${statusLabels[fb.status] || fb.status}</span>
        ${fb.rpe ? ` &nbsp;·&nbsp; <span class="label">RPE</span><span class="value">${fb.rpe}/10</span>` : ''}
        ${fb.actual_workout_type ? `<br><span class="label">Did instead</span><span class="value">${fb.actual_workout_type}${fb.actual_workout_detail ? ' — ' + fb.actual_workout_detail : ''}</span>` : ''}
        ${fb.skip_reason ? `<br><span class="label">Reason</span><span class="value">${skipLabels[fb.skip_reason] || fb.skip_reason}</span>` : ''}
        ${fb.note ? `<div class="checkin-summary-note">"${fb.note}"</div>` : ''}
      </div>
    `;
  }
  // Editor view
  return `
    <div class="feedback-label">How did it go?</div>
    <div class="feedback-buttons">
      <button class="fb-btn did_it ${pendingFeedback.status === 'did_it' ? 'active' : ''}" onclick="setFeedbackStatus('did_it')">✓ Did it</button>
      <button class="fb-btn modified ${pendingFeedback.status === 'modified' ? 'active' : ''}" onclick="setFeedbackStatus('modified')">⟳ Modified</button>
      <button class="fb-btn skipped ${pendingFeedback.status === 'skipped' ? 'active' : ''}" onclick="setFeedbackStatus('skipped')">— Skipped</button>
    </div>
    <div class="fb-details ${pendingFeedback.status ? 'show' : ''}">${renderFeedbackDetails()}</div>
  `;
}

function renderFeedbackDetails(){
  const status = pendingFeedback.status;
  if (!status) return '';
  let html = '';
  if (status === 'modified'){
    const wt = pendingFeedback.actual_workout_type;
    html += `<div class="fb-detail-label">What did you actually do?</div>
      <div class="pill-options">${['cycling','strength','run','yoga','hike','swim','other'].map(t => `<button class="pill ${wt===t?'selected':''}" onclick="setFeedbackField('actual_workout_type','${t}')">${t}</button>`).join('')}</div>
      <input type="text" class="checkin-note" placeholder="Specifics? (e.g., 60 min easy spin)" value="${pendingFeedback.actual_workout_detail || ''}" oninput="pendingFeedback.actual_workout_detail = this.value" style="margin-top:8px">`;
  }
  if (status === 'skipped'){
    const sr = pendingFeedback.skip_reason;
    html += `<div class="fb-detail-label">Why?</div>
      <div class="pill-options">
        <button class="pill ${sr==='too_tired'?'selected':''}" onclick="setFeedbackField('skip_reason','too_tired')">Too tired</button>
        <button class="pill ${sr==='no_time'?'selected':''}" onclick="setFeedbackField('skip_reason','no_time')">No time</button>
        <button class="pill ${sr==='weather'?'selected':''}" onclick="setFeedbackField('skip_reason','weather')">Weather</button>
        <button class="pill ${sr==='sick'?'selected':''}" onclick="setFeedbackField('skip_reason','sick')">Sick / sore</button>
        <button class="pill ${sr==='other'?'selected':''}" onclick="setFeedbackField('skip_reason','other')">Other</button>
      </div>`;
  }
  if (status === 'did_it' || status === 'modified'){
    html += `<div class="fb-detail-label">RPE (1=easy, 10=max)</div>
      <div class="rpe-wrap">
        <input type="range" min="1" max="10" value="${pendingFeedback.rpe}" class="rpe-slider" oninput="pendingFeedback.rpe = +this.value; document.getElementById('rpeVal').textContent = this.value">
        <div class="rpe-value" id="rpeVal">${pendingFeedback.rpe}</div>
      </div>`;
  }
  html += `<div class="fb-detail-label">Notes (optional)</div>
    <textarea class="checkin-note" placeholder="How the legs felt, anything notable…" rows="2" oninput="pendingFeedback.note = this.value">${pendingFeedback.note || ''}</textarea>
    <button class="btn-save" id="fbSaveBtn" onclick="saveFeedback()">Save feedback</button>`;
  return html;
}

function setFeedbackStatus(status){
  pendingFeedback.status = status;
  if (status !== 'modified'){ pendingFeedback.actual_workout_type = null; pendingFeedback.actual_workout_detail = ''; }
  if (status !== 'skipped') pendingFeedback.skip_reason = null;
  renderToday();
}
function setFeedbackField(key, val){ pendingFeedback[key] = val; renderToday(); }

async function saveFeedback(){
  const btn = document.getElementById('fbSaveBtn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const r = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        date: todayStr(),
        status: pendingFeedback.status,
        rpe: pendingFeedback.rpe,
        actual_workout_type: pendingFeedback.actual_workout_type,
        actual_workout_detail: pendingFeedback.actual_workout_detail,
        skip_reason: pendingFeedback.skip_reason,
        note: pendingFeedback.note,
      }),
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error || 'Save failed');
    btn.textContent = '✓ Saved';
    btn.classList.add('saved');
    if (appData.prescriptions[0]) appData.prescriptions[0].feedback = { ...pendingFeedback, date: todayStr() };
    window._editFeedback = false;
    setTimeout(() => renderToday(), 700);
  } catch(e){
    btn.disabled = false;
    btn.textContent = 'Save feedback';
    alert('Save failed: ' + e.message);
  }
}

function nutritionRow(label, val){return `<div class="nutrition-row"><div class="label">${label}</div><div class="value">${val||'—'}</div></div>`}

function renderTrends(){
  const el = document.getElementById('trendsContent');
  const snaps = [...appData.snapshots].reverse();
  if(snaps.length === 0){ el.innerHTML = '<div class="empty"><strong>No trend data yet</strong>Run a few days to build trends.</div>'; return; }

  function chart(values, color, valFmt) {
    const max = Math.max(...values.filter(v => v != null), 1);
    return values.map((v, i) => {
      if (v == null) return `<div class="chart-col"><div class="chart-val">—</div><div class="chart-bar"></div><div class="chart-day">${fmtDay(snaps[i].date)}</div></div>`;
      const h = (v / max) * 100;
      return `<div class="chart-col"><div class="chart-val">${valFmt(v)}</div><div class="chart-bar"><div class="chart-bar-fill" style="height:${h}%;background:${color}"></div></div><div class="chart-day">${fmtDay(snaps[i].date)}</div></div>`;
    }).join('');
  }

  const recBars = snaps.map(s => {
    const v = s.recovery_pct || 0;
    const h = v;
    const col = recColor(v);
    const bg = col === 'green' ? 'var(--rec-green)' : col === 'yellow' ? 'var(--rec-yellow)' : 'var(--rec-red)';
    return `<div class="chart-col"><div class="chart-val">${v||'—'}</div><div class="chart-bar"><div class="chart-bar-fill" style="height:${h}%;background:${bg}"></div></div><div class="chart-day">${fmtDay(s.date)}</div></div>`;
  }).join('');

  const checkins = [...(appData.checkins || [])].reverse();
  const alcoholBars = checkins.length ? checkins.map(c => {
    const v = c.alcohol_drinks ?? 0;
    const h = (v / 5) * 100;
    const col = v >= 3 ? 'var(--rec-red)' : v >= 2 ? 'var(--rec-yellow)' : 'var(--rec-green)';
    return `<div class="chart-col"><div class="chart-val">${v}</div><div class="chart-bar"><div class="chart-bar-fill" style="height:${h}%;background:${col}"></div></div><div class="chart-day">${fmtDay(c.date)}</div></div>`;
  }).join('') : '';

  el.innerHTML = `
    <div class="section">${sectionHeader('01', 'Recovery', `LAST ${snaps.length} DAYS`)}<div class="chart-card"><div class="chart-row">${recBars}</div></div></div>
    <div class="section">${sectionHeader('02', 'HRV', 'MS')}<div class="chart-card"><div class="chart-row">${chart(snaps.map(s => s.hrv), 'var(--la-brown)', v => v.toFixed(0))}</div></div></div>
    <div class="section">${sectionHeader('03', 'Daily Strain', '/ 21')}<div class="chart-card"><div class="chart-row">${chart(snaps.map(s => s.yesterday_strain), 'var(--info-blue)', v => v.toFixed(1))}</div></div></div>
    <div class="section">${sectionHeader('04', 'Sleep Hours', '')}<div class="chart-card"><div class="chart-row">${chart(snaps.map(s => s.sleep_hours), 'var(--info-blue)', v => v.toFixed(1))}</div></div></div>
    ${alcoholBars ? `<div class="section">${sectionHeader('05', 'Drinks Logged', '')}<div class="chart-card"><div class="chart-row">${alcoholBars}</div></div></div>` : ''}
  `;
}

function renderHistory(){
  const el = document.getElementById('historyContent');
  const items = appData.prescriptions;
  const acts = appData.activities;
  if(items.length === 0){ el.innerHTML = '<div class="empty"><strong>No history yet</strong>Run your first prescription to start.</div>'; return; }

  const prescHtml = items.map(p => {
    const fr = p.full_response || {};
    const w = fr.workout || {};
    const fb = p.feedback;
    const fbBadge = fb ? `<span class="history-badge ${fb.status}">${fb.status === 'did_it' ? '✓ done' : fb.status === 'modified' ? '⟳ modified' : '— skipped'}${fb.rpe ? ' · RPE '+fb.rpe : ''}</span>` : '';
    return `<div class="history-card">
      <div class="history-date">${fmtDate(p.date)}${fbBadge}</div>
      <div class="history-title">${fr.headline || p.workout_type || '—'}</div>
      <div class="history-detail">${(w.specific_workout || '').slice(0,200)}${w.specific_workout?.length > 200 ? '…' : ''}</div>
      ${fb?.actual_workout_type ? `<div class="history-actual">→ Did instead: <strong>${fb.actual_workout_type}</strong>${fb.actual_workout_detail ? ' — ' + fb.actual_workout_detail : ''}</div>` : ''}
      ${fb?.skip_reason ? `<div class="history-skip">→ Skipped: ${fb.skip_reason.replace(/_/g, ' ')}</div>` : ''}
      ${fb?.note ? `<div class="history-note">"${fb.note}"</div>` : ''}
    </div>`;
  }).join('');

  const actsHtml = acts.length ? `
    <div class="section">${sectionHeader('02', 'Recent Activities', `${acts.length} TOTAL`)}
      <div class="activity-card">
        ${acts.slice(0,10).map(a => `<div class="activity-row">
          <div class="activity-info">
            <div class="activity-type">${a.type} · ${fmtShortDate(a.date)}</div>
            <div class="activity-meta">${a.distance_m ? (a.distance_m/1000).toFixed(1)+'km' : ''} ${a.elevation_gain_m ? '· '+Math.round(a.elevation_gain_m)+'m gain' : ''}</div>
          </div>
          <div class="activity-stats">
            ${a.duration_sec ? Math.round(a.duration_sec/60)+' min' : ''}<br>
            ${a.avg_hr ? Math.round(a.avg_hr)+'bpm' : ''}${a.avg_power ? ' · '+Math.round(a.avg_power)+'W' : ''}
          </div>
        </div>`).join('')}
      </div>
    </div>` : '';

  el.innerHTML = `
    <div class="section">${sectionHeader('01', 'Prescriptions', `LAST ${items.length}`)}${prescHtml}</div>
    ${actsHtml}
  `;
}

loadData();
</script>
</body>
</html>
